name: CI/CD SmartCampus

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

env:
  IMAGE_NAME: smartcampus
  APP_ENV: ci

jobs:
  # Etapas 1-3: checkout, instalacion y calidad
  quality:
    name: Calidad (Ruff)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements-dev.txt

      - name: Ruff lint
        run: ruff check .

      - name: Ruff formato
        run: ruff format --check .

  # Etapa 4: tests con matrix (3.11 y 3.12 en paralelo)
  tests:
    name: Tests (Python ${{ matrix.python-version }})
    needs: quality
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Instalar Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements-dev.txt

      - name: Tests unitarios
        run: pytest tests/unit -v

      - name: Tests de integracion
        run: pytest tests/integration -v

  # Etapas 5-6: build y validacion de la imagen Docker
  build:
    name: Build y validacion Docker
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validar docker-compose.yml
        run: docker compose config -q

      - name: Construir imagen
        run: docker build -t $IMAGE_NAME:${{ github.sha }} .

      - name: Validar que la imagen arranca
        run: |
          docker run -d --name smoke -p 8000:8000 $IMAGE_NAME:${{ github.sha }}
          for i in $(seq 1 15); do
            if curl -fs http://localhost:8000/health; then
              echo ""
              echo "OK: imagen validada"
              exit 0
            fi
            sleep 2
          done
          echo "ERROR: la imagen no responde"
          docker logs smoke
          exit 1

      - name: Login en Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Publicar imagen en Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
        run: |
          docker tag $IMAGE_NAME:${{ github.sha }} $DOCKER_USERNAME/$IMAGE_NAME:latest
          docker tag $IMAGE_NAME:${{ github.sha }} $DOCKER_USERNAME/$IMAGE_NAME:${{ github.sha }}
          docker push $DOCKER_USERNAME/$IMAGE_NAME:latest
          docker push $DOCKER_USERNAME/$IMAGE_NAME:${{ github.sha }}

  # Etapa 7: despliegue en el self-hosted runner de Windows (solo en main)
  deploy:
    name: Deploy
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, windows]
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v4

      - name: Crear .env de produccion
        run: Set-Content -Path .env -Value "APP_ENV=production", "BACKEND_PORT=8000", "PROXY_PORT=8080"

      - name: Desplegar con Docker Compose
        run: docker compose up -d --build

      - name: Comprobar despliegue
        run: |
          for ($i = 1; $i -le 20; $i++) {
            try {
              $r = Invoke-WebRequest -UseBasicParsing http://127.0.0.1:8080/health
              Write-Output $r.Content
              Write-Output "OK: SmartCampus desplegado en http://localhost:8080"
              exit 0
            } catch {
              Start-Sleep -Seconds 3
            }
          }
          docker compose ps
          docker compose logs
          exit 1